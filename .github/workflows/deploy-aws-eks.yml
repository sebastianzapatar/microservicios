name: Deploy Microservices to AWS EKS

on:
  push:
    branches:
      - main
    paths:
      - 'order-service/**'
      - 'product-service/**'
      - 'apigetaway/**'
      - 'eureka/**'
      - 'serversc/**'
      - 'k8s/**'
      - '.github/workflows/**'

env:
  AWS_REGION: us-east-1 # Cambia a tu región de AWS preferida
  EKS_CLUSTER_NAME: my-first-eks-cluster # Nombre de tu clúster EKS

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, product-service, apigetaway, eureka, serversc]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17' # Asegúrate de que coincida con tu versión de Java
          distribution: 'temurin'
          cache: maven

      - name: Build Java Application
        working-directory: ./${{ matrix.service }}
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.service }} # Tu repo en ECR debe llamarse igual que el microservicio
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./${{ matrix.service }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-eks:
    name: Deploy to Amazon EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        
      - name: Deploy to EKS using Kustomize
        run: |
          # Actualizar la etiqueta de las imágenes en los manifiestos
          # (requiere tener kustomize instalado y configurarlo en la carpeta k8s)
          cd k8s
          
          # Como estrategia básica, aplicaremos los archivos de k8s
          kubectl apply -k .
          
          # Verificar estado de los pods (opcional, para el log de GH Actions)
          kubectl get pods -n default
