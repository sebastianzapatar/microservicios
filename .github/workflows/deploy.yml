name: Deploy Microservices to AWS ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  PROJECT_NAME: microservices
  ECS_CLUSTER: microservices-cluster

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # BUILD AND PUSH ALL IMAGES
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: apigetaway
            context: ./apigetaway
            port: 8089
          - service: eureka
            context: ./eureka
            port: 8761
          - service: serversc
            context: ./serversc
            port: 8888
          - service: product-service
            context: ./product-service
            port: 8084
          - service: order-service
            context: ./order-service
            port: 8083

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}/${{ matrix.service }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─────────────────────────────────────────────────────────────────────────────
  # DEPLOY SERVICES (sequential, respecting startup order)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy eureka
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ env.PROJECT_NAME }}-eureka \
            --query 'taskDefinition' --output json)
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}/eureka:${{ github.sha }}"
          NEW_TASK_DEF=$(echo "$TASK_DEF" | \
            jq --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)')
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.PROJECT_NAME }}-eureka \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.PROJECT_NAME }}-eureka

      - name: Deploy serversc (Config Server)
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ env.PROJECT_NAME }}-serversc \
            --query 'taskDefinition' --output json)
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}/serversc:${{ github.sha }}"
          NEW_TASK_DEF=$(echo "$TASK_DEF" | \
            jq --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)')
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.PROJECT_NAME }}-serversc \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.PROJECT_NAME }}-serversc

      - name: Deploy product-service and order-service in parallel
        run: |
          for SERVICE in product-service order-service; do
            TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition ${{ env.PROJECT_NAME }}-${SERVICE} \
              --query 'taskDefinition' --output json)
            NEW_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}/${SERVICE}:${{ github.sha }}"
            NEW_TASK_DEF=$(echo "$TASK_DEF" | \
              jq --arg IMAGE "$NEW_IMAGE" \
              '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)')
            NEW_TASK_ARN=$(aws ecs register-task-definition \
              --cli-input-json "$NEW_TASK_DEF" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service ${{ env.PROJECT_NAME }}-${SERVICE} \
              --task-definition "$NEW_TASK_ARN" \
              --force-new-deployment &
          done
          wait
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.PROJECT_NAME }}-product-service ${{ env.PROJECT_NAME }}-order-service

      - name: Deploy apigetaway
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ env.PROJECT_NAME }}-apigetaway \
            --query 'taskDefinition' --output json)
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}/apigetaway:${{ github.sha }}"
          NEW_TASK_DEF=$(echo "$TASK_DEF" | \
            jq --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)')
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.PROJECT_NAME }}-apigetaway \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.PROJECT_NAME }}-apigetaway

      - name: Print deployment URL
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names microservices-alb \
            --query 'LoadBalancers[0].DNSName' --output text)
          echo "✅ Deployment complete!"
          echo "🌐 API URL: http://${ALB_DNS}"
          echo "📦 Products: http://${ALB_DNS}/api/products"
          echo "📋 Orders:   http://${ALB_DNS}/api/orders"
